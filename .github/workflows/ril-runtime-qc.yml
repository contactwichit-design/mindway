name: RIL Runtime QC
on:
  push:
    branches: [ril-runtime-hardening-20260811]
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/ril-runtime-qc.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: python -m py_compile runtime/loop_runtime.py runtime/recursive_improvement.py
      - name: Run RIL tests
        working-directory: runtime
        run: python -m unittest -v test_recursive_improvement.py test_loop_runtime_v2.py
