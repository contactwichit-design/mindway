name: Mindway Runtime Tests
on:
  push:
    paths:
      - 'runtime/**'
      - 'skills/loop/**'
      - 'skills/mindway-mcp/**'
      - '.github/workflows/runtime-tests.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'skills/loop/**'
      - 'skills/mindway-mcp/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: python -m compileall -q runtime
      - name: Runtime regressions
        working-directory: runtime
        run: python -m unittest discover -v -p 'test_*.py'
