name: Mindway Runtime Tests
on:
  push:
    paths:
      - 'my.md'
      - 'BOOTSTRAP.md'
      - 'README.md'
      - 'PUBLIC_STANDARD.md'
      - 'INVARIANTS.md'
      - 'ARCHITECTURE.md'
      - 'runtime/**'
      - 'skills/entry-access-gate/**'
      - 'skills/loop/**'
      - 'skills/fy/**'
      - 'skills/execution-loop/**'
      - 'skills/mindway-mcp/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/runtime-tests.yml'
  pull_request:
    paths:
      - 'my.md'
      - 'BOOTSTRAP.md'
      - 'README.md'
      - 'PUBLIC_STANDARD.md'
      - 'INVARIANTS.md'
      - 'ARCHITECTURE.md'
      - 'runtime/**'
      - 'skills/entry-access-gate/**'
      - 'skills/loop/**'
      - 'skills/fy/**'
      - 'skills/execution-loop/**'
      - 'skills/mindway-mcp/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/runtime-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: python -m compileall -q runtime
      - name: Runtime regressions
        working-directory: runtime
        run: python -m unittest discover -v -p 'test_*.py'
