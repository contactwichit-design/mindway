<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mindway Observatory</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#222;background:#f7f5ef}*{box-sizing:border-box}body{margin:0}.app{height:100vh;display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr 190px;gap:1px;background:#d8d3c8}.panel{background:#fbfaf6;overflow:auto}.graph{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff 0,#f6f2e8 45%,#ece7dc 100%)}svg{width:100%;height:100%}.edge{stroke:#c6bca9;stroke-width:1.5}.node{cursor:pointer}.node circle{fill:#fff;stroke:#292929;stroke-width:1.5}.node text{font-size:11px;fill:#222}.node[data-status=failed] circle{stroke:#c85b45}.node[data-status=complete] circle{stroke:#a26b2f}.inspector{padding:20px}.inspector h2{margin:0 0 12px;font-size:18px}.kv{display:grid;grid-template-columns:90px 1fr;gap:7px;font-size:13px}.timeline{grid-column:1/3;padding:16px;white-space:nowrap;overflow:auto}.event{display:inline-flex;vertical-align:top;flex-direction:column;width:145px;margin-right:10px;padding:10px;border:1px solid #d9d2c5;border-radius:12px;background:#fff;cursor:pointer}.event b{font-size:12px}.event small{margin-top:5px;color:#6b655c}.head{position:absolute;z-index:2;left:18px;top:16px}.head b{font-size:14px}.head div{font-size:11px;color:#777;margin-top:4px}</style></head><body><main class="app"><section class="panel graph"><div class="head"><b>Mindway Observatory</b><div>Universe Graph · event-derived, deterministic</div></div><svg id="graph"></svg></section><aside class="panel inspector"><h2>Inspector</h2><div id="detail">Select a node or event.</div></aside><section class="panel timeline" id="timeline"></section></main><script>const demo={nodes:[{id:'mission',type:'task',label:'Mission',status:'running'},{id:'loop',type:'runtime',label:'/loop',status:'running'},{id:'tool',type:'tool',label:'Tool',status:'complete'},{id:'verify',type:'verifier',label:'Verify',status:'failed'},{id:'fix',type:'fixer',label:'Fix',status:'complete'},{id:'return',type:'task',label:'Return',status:'running'}],edges:[['mission','loop'],['loop','tool'],['tool','verify'],['verify','fix'],['fix','verify'],['verify','return']],events:[['task.created','Mission'],['work.started','/loop'],['tool.succeeded','Tool'],['verify.fail','Verify'],['fix.completed','Fix'],['verify.pass','Verify'],['run.completed','Return']]};let state=demo;const svg=document.querySelector('#graph'),detail=document.querySelector('#detail'),tl=document.querySelector('#timeline');function inspect(o){detail.innerHTML='<div class="kv">'+Object.entries(o).map(([k,v])=>`<b>${k}</b><span>${Array.isArray(v)?v.join(' → '):v}</span>`).join('')+'</div>'}function render(){const w=svg.clientWidth||900,h=svg.clientHeight||600,cx=w/2,cy=h/2;const pos={};state.nodes.forEach((n,i)=>{const a=(i/state.nodes.length)*Math.PI*2-Math.PI/2,r=Math.min(w,h)*.31;pos[n.id]=[cx+Math.cos(a)*r,cy+Math.sin(a)*r]});svg.innerHTML=state.edges.map(e=>`<line class="edge" x1="${pos[e[0]][0]}" y1="${pos[e[0]][1]}" x2="${pos[e[1]][0]}" y2="${pos[e[1]][1]}"/>`).join('')+state.nodes.map(n=>`<g class="node" data-id="${n.id}" data-status="${n.status}" transform="translate(${pos[n.id]})"><circle r="25"/><text text-anchor="middle" y="42">${n.label}</text></g>`).join('');svg.querySelectorAll('.node').forEach(el=>el.onclick=()=>inspect(state.nodes.find(n=>n.id===el.dataset.id)));tl.innerHTML=state.events.map((e,i)=>`<div class="event" data-i="${i}"><b>${e[0]}</b><small>${e[1]}</small></div>`).join('');tl.querySelectorAll('.event').forEach(el=>el.onclick=()=>inspect({sequence:+el.dataset.i,type:state.events[+el.dataset.i][0],subject:state.events[+el.dataset.i][1]}) )}window.loadMindwayRun=function(run){state=run;render()};addEventListener('resize',render);render();</script></body></html>
